# CI workflow for ggvisual/duckpipe
#
# Runs on:
# - Push to main branch (direct commits / merges)
# - Pull requests to main
# - Tags starting with 'v' (triggers release)
#
# Jobs:
# - lint-and-test: Check formatting, run go vet, and run unit tests
# - build: Matrix build of duckpipe/ggvisual for Linux amd64/arm64 (depends on lint-and-test)
# - docker: Build and push the cli/service container images (depends on build)
# - release: Create GitHub release with binaries (only on version tags)

name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  GO_VERSION: '1.25'
  CLI_IMAGE_NAME: ghcr.io/${{ github.repository }}-cli
  SERVICE_IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted correctly:"
            gofmt -l .
            echo ""
            echo "Please run 'go fmt ./...' or 'make fmt' to fix."
            exit 1
          fi
          echo "All files are properly formatted."

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build duckpipe and ggvisual
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -ldflags="-s -w" -o duckpipe ./cmd/duckpipe
          go build -ldflags="-s -w" -o ggvisual ./cmd/ggvisual
          ls -lh duckpipe ggvisual

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          mv duckpipe dist/duckpipe-linux-${{ matrix.arch }}
          mv ggvisual dist/ggvisual-linux-${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-linux-${{ matrix.arch }}
          path: dist/*

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    # Only build Docker on main branch or tags (not PRs)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (cli image)
        id: meta-cli
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.CLI_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push cli image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          target: cli
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-cli.outputs.tags }}
          labels: ${{ steps.meta-cli.outputs.labels }}
          cache-from: type=gha,scope=cli
          cache-to: type=gha,mode=max,scope=cli

      - name: Extract metadata (service image)
        id: meta-service
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.SERVICE_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push service image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          target: service
          platforms: linux/amd64
          push: true
          load: true
          tags: ${{ steps.meta-service.outputs.tags }}
          labels: ${{ steps.meta-service.outputs.labels }}
          cache-from: type=gha,scope=service
          cache-to: type=gha,mode=max,scope=service

      - name: Smoke-test service image
        run: |
          docker run -d --name ggvisual-smoke -p 8080:8080 ${{ env.SERVICE_IMAGE_NAME }}:latest
          sleep 2
          curl -fsS http://localhost:8080/health
          docker rm -f ggvisual-smoke

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name "duckpipe-*" -o -name "ggvisual-*" \) -exec mv {} release/ \;
          echo "Release assets:"
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt
          echo ""
          echo "Checksums:"
          cat checksums.txt

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" $PREV_TAG..HEAD)
          else
            COMMIT_COUNT=$(git rev-list --count HEAD)
            if [ "$COMMIT_COUNT" -gt 10 ]; then
              CHANGELOG=$(git log --pretty=format:"- %s (%h)" -n 10)
            else
              CHANGELOG=$(git log --pretty=format:"- %s (%h)")
            fi
          fi

          cat > release_notes.md << EOF
          ## ggvisual ${{ steps.version.outputs.VERSION }}

          ### Docker Images

          \`\`\`bash
          docker pull ${{ env.SERVICE_IMAGE_NAME }}:${GITHUB_REF#refs/tags/v}
          docker pull ${{ env.CLI_IMAGE_NAME }}:${GITHUB_REF#refs/tags/v}
          \`\`\`

          Available for \`linux/amd64\`.

          ### Changes

          $CHANGELOG

          ### Assets

          | Binary | Architecture |
          |--------|--------------|
          | \`duckpipe-linux-amd64\` | Linux AMD64 |
          | \`duckpipe-linux-arm64\` | Linux ARM64 |
          | \`ggvisual-linux-amd64\` | Linux AMD64 |
          | \`ggvisual-linux-arm64\` | Linux ARM64 |

          ### Checksums (SHA256)

          \`\`\`
          $(cat release/checksums.txt)
          \`\`\`

          See the [README](https://github.com/${{ github.repository }}#readme) for usage.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
